      <h1 id="heading">Линтер DevOps-конфигов в браузере</h1>
      <p class="lead" id="lead">
        JSON/YAML, Dockerfile, Compose, Kubernetes, GitLab CI и GitHub Actions — эвристики локально. Это не замена CI-линтеров.
      </p>
      <p class="tip" id="rl-tip"></p>

      <noscript>
        <p class="noscript" data-i18n="noscript">
          Включите JavaScript, чтобы проверить конфиг.
        </p>
      </noscript>

      <div class="tabs" role="tablist" aria-label="Тип конфига">
        <button type="button" class="tab is-active" role="tab" id="tab-json-yaml" data-tab="json-yaml" aria-selected="true">
          JSON + YAML
        </button>
        <button type="button" class="tab" role="tab" id="tab-docker" data-tab="docker" aria-selected="false">
          Dockerfile + Compose
        </button>
        <button type="button" class="tab" role="tab" id="tab-k8s" data-tab="k8s" aria-selected="false">
          Kubernetes
        </button>
        <button type="button" class="tab" role="tab" id="tab-gitlab" data-tab="gitlab" aria-selected="false">
          GitLab CI
        </button>
        <button type="button" class="tab" role="tab" id="tab-github" data-tab="github" aria-selected="false">
          GitHub Actions
        </button>
      </div>
      <p class="tab-soon" id="tab-soon" hidden></p>

      <section class="panel lint-panel" id="panel-lint" aria-labelledby="input-label">
        <div class="format-row" id="format-row">
          <label class="field-label" for="format-mode" id="format-label">Формат</label>
          <select id="format-mode" class="format-select">
            <option value="auto" id="opt-auto">Авто</option>
            <option value="json" id="opt-json">JSON</option>
            <option value="yaml" id="opt-yaml">YAML</option>
          </select>
          <span class="format-detected" id="format-detected" hidden></span>
        </div>
        <label class="field-label" id="input-label" for="text-input">Конфиг</label>
        <div class="field-wrap">
          <textarea
            id="text-input"
            class="text-input"
            rows="14"
            spellcheck="false"
            autocomplete="off"
            placeholder='{"service": "api", "replicas": 2}'
          ></textarea>
        </div>
        <div class="examples-row">
          <span class="field-label" id="examples-label">Примеры</span>
          <div class="examples" id="examples"></div>
        </div>
        <div class="toolbar convert-row" id="convert-row" hidden>
          <button type="button" class="btn btn-secondary" id="to-json">→ JSON</button>
          <button type="button" class="btn btn-secondary" id="to-yaml">→ YAML</button>
        </div>
        <div class="toolbar">
          <button type="button" class="btn" id="lint">Проверить</button>
          <button type="button" class="btn btn-secondary" id="format">Форматировать</button>
          <button type="button" class="btn btn-secondary" id="clear">Очистить</button>
          <button type="button" class="btn btn-secondary" id="share">Ссылка</button>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </section>

      <section class="panel results" id="results" hidden>
        <div class="results-head">
          <h2 id="issues-title">Замечания</h2>
          <button type="button" class="btn btn-secondary" id="download" hidden>Скачать</button>
        </div>
        <ul class="issues" id="issues"></ul>
      </section>

      <article class="seo" id="seo-root"></article>
    </main>
    <script type="module" src="/src/main.ts"></script>
